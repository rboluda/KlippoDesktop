[package]
name = "klippo"
version = "1.7.0"
description = "Klippo para Windows: descarga, recorta y comparte vídeos"
authors = ["rboluda"]
license = "GPL-3.0-or-later"
repository = "https://github.com/rboluda/KlippoDesktop"
edition = "2024"

[lib]
# El sufijo _lib evita que la biblioteca choque con el ejecutable en Windows
# (https://github.com/rust-lang/cargo/issues/8519)
name = "klippo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
clipboard-master = "4.1.0"
clipboard-win = "5.4.3"
tauri-winrt-notification = "0.8.1"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-autostart = "2.7.0"
windows = { version = "0.62", features = ["ApplicationModel_DataTransfer", "Storage", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_UI_Shell", "Win32_Foundation"] }
windows-collections = "0.3"
windows-future = "0.3"
windows-registry = "0.6"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-drag = "2.1.1"
base64 = "0.22"
ureq = "3"
unicode-normalization = "0.1.26"

# Tamaño mínimo del ejecutable (https://tauri.app/concept/size/)
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
